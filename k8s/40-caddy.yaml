# Caddy — the TLS edge, kept from the compose setup (we install k3s with --disable traefik
# so nothing else binds 80/443). Caddy still auto-obtains + renews the Let's Encrypt cert and
# reverse-proxies to the api / logstream Services by their in-cluster DNS names.
#
# It reaches the host's 80/443 via hostPort (single node, so this is the simplest ingress).
# /data is a PVC so the issued certificate survives pod restarts and we don't re-hit ACME.
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: experimentation
data:
  Caddyfile: |
    api.gunbarrelstudio.com {
    	# WebSocket + the /logstream/reset and /logstream/containers endpoints.
    	handle /logstream* {
    		reverse_proxy logstream:8080
    	}
    	# Everything else → the GraphQL API.
    	handle {
    		reverse_proxy api:4000
    	}
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: experimentation
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: experimentation
spec:
  replicas: 1
  # RWO PVC → don't let a rolling update start a second pod on the same volume.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: caddy }
  template:
    metadata:
      labels: { app: caddy }
    spec:
      containers:
        - name: caddy
          image: caddy:2
          ports:
            - containerPort: 80
              hostPort: 80
            - containerPort: 443
              hostPort: 443
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: data
              mountPath: /data
            - name: config-dir
              mountPath: /config
      volumes:
        - name: config
          configMap: { name: caddy-config }
        - name: data
          persistentVolumeClaim: { claimName: caddy-data }
        - name: config-dir
          emptyDir: {}
