# Phase 2 — the per-session stack, applied by the provisioner into a fresh `session-<id>`
# namespace (one isolated stack per visitor). This is Phase 1's backend MINUS Caddy (the shared
# edge routes to each session), with three differences suited to throwaway sessions:
#   - ephemeral storage (emptyDir) instead of PVCs — a session dies, its data goes with it;
#   - a ResourceQuota + LimitRange so one session can't starve the box;
#   - a default-deny NetworkPolicy so sessions can't reach each other.
#
# No `namespace:` fields — the provisioner applies this with `-n session-<id>`. Cross-service
# references use bare Service names (postgres, mongo, redis), which resolve inside the session's
# own namespace, so each session talks only to its own datastores.
#
# NOT part of the live deploy: this lives under k8s/phase2/, which `kubectl apply -f k8s/` skips.
# ---------------------------------------------------------------------------- guardrails
apiVersion: v1
kind: ResourceQuota
metadata:
  name: session-quota
spec:
  hard:
    # 6 containers × 256Mi default limit = 1536Mi, so the limit ceiling must exceed that (plus a
    # transient curl/exec pod). This is a QUOTA (a ceiling on the sum of limits), not a physical
    # RAM reservation — actual usage per session is ~550MB, so two sessions still fit a t3.medium.
    requests.memory: 1Gi
    limits.memory: 2560Mi
    requests.cpu: "1"
    limits.cpu: "4"
    pods: "12"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: session-limits
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 256Mi }
      defaultRequest: { cpu: 50m, memory: 96Mi }
---
# Default-deny cross-namespace: a session pod accepts traffic only from its own namespace and
# from the control-plane namespace (where the shared Caddy lives, labeled tier=control-plane).
# Egress is left open so pods can reach CoreDNS and (for logstream) the Kubernetes API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-isolation
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {} # same namespace
        - namespaceSelector:
            matchLabels: { tier: control-plane } # the shared Caddy edge
---
# ------------------------------------------------------------------------------ Postgres
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_USER, value: experimentation }
            - { name: POSTGRES_PASSWORD, value: experimentation }
            - { name: POSTGRES_DB, value: experiments }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "experimentation", "-d", "experiments"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
# --------------------------------------------------------------------------------- Mongo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          # Cap the WiredTiger cache, and give mongo more than the LimitRange's 256Mi default —
          # otherwise mongod + the mongosh readiness probe blow past 256Mi, the probe gets
          # OOM-killed, mongo never reports ready, and the api's init container waits forever.
          args: ["--quiet", "--wiredTigerCacheSizeGB", "0.25"] # entrypoint still adds --bind_ip_all
          resources:
            requests: { memory: 200Mi }
            limits: { memory: 512Mi }
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
          readinessProbe:
            # TCP, not a `mongosh` exec: under the memory limit, spawning mongosh (a heavy Node
            # app) exceeds the 1s probe timeout, so mongo never went Ready and the api init hung.
            # mongod opens 27017 only when accepting connections, so this is a sound readiness signal.
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: mongo }
spec:
  selector: { app: mongo }
  ports: [{ port: 27017, targetPort: 27017 }]
---
# --------------------------------------------------------------------------------- Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7
          ports: [{ containerPort: 6379 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
# ----------------------------------------------------------------------------------- api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z postgres 5432 && nc -z mongo 27017 && nc -z redis 6379; do echo waiting; sleep 2; done"
      containers:
        - name: api
          image: experimentation-api:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "npx prisma db push --skip-generate && npm run start"]
          # More than the 256Mi default — `prisma db push` + tsx + Apollo can spike past it on boot.
          resources:
            requests: { memory: 150Mi }
            limits: { memory: 384Mi }
          env:
            - { name: DATABASE_URL, value: "postgresql://experimentation:experimentation@postgres:5432/experiments?schema=public" }
            - { name: MONGO_URL, value: "mongodb://mongo:27017" }
            - { name: MONGO_DB, value: experiments_events }
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: PORT, value: "4000" }
          ports: [{ containerPort: 4000 }]
          readinessProbe:
            tcpSocket: { port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: api }
spec:
  selector: { app: api }
  ports: [{ port: 4000, targetPort: 4000 }]
---
# --------------------------------------------------------------------------------- stats
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats
spec:
  replicas: 1
  selector: { matchLabels: { app: stats } }
  template:
    metadata: { labels: { app: stats } }
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongo 27017; do echo waiting; sleep 2; done"]
      containers:
        - name: stats
          image: experimentation-stats:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: MONGO_URL, value: "mongodb://mongo:27017" }
            - { name: MONGO_DB, value: experiments_events }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: stats }
spec:
  selector: { app: stats }
  ports: [{ port: 8000, targetPort: 8000 }]
---
# ----------------------------------------------------------------------------- logstream
apiVersion: v1
kind: ServiceAccount
metadata: { name: logstream }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: logstream-pod-reader }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: logstream-pod-reader }
subjects:
  - { kind: ServiceAccount, name: logstream }
roleRef:
  kind: Role
  name: logstream-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstream
spec:
  replicas: 1
  selector: { matchLabels: { app: logstream } }
  template:
    metadata: { labels: { app: logstream } }
    spec:
      serviceAccountName: logstream
      containers:
        - name: logstream
          image: experimentation-logstream:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "server.k8s.js"]
          env:
            - { name: LOGSTREAM_TOKEN, value: let-me-see-the-logs }
            - { name: ALLOWED_ORIGIN, value: "https://experimentation.gunbarrelstudio.com" }
            - { name: MAX_STREAM_SECONDS, value: "1200" }
            - { name: RESET_COOLDOWN_SECONDS, value: "30" }
            - { name: LOG_SERVICES, value: "api,stats" }
            - name: NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: logstream }
spec:
  selector: { app: logstream }
  ports: [{ port: 8080, targetPort: 8080 }]
