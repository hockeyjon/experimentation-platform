# Phase 3 — the experiment advisor (shared, stateless). One pod in the control-plane namespace;
# the browser sends the on-screen experiment data in the request body, so it never touches a
# session namespace. Auth to Bedrock is the EC2 instance role via IMDS (no key, no k8s Secret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: experimentation
spec:
  replicas: 1
  selector: { matchLabels: { app: agent } }
  template:
    metadata: { labels: { app: agent } }
    spec:
      containers:
        - name: agent
          image: experimentation-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: BEDROCK_REGION, value: "us-east-1" } # Haiku 4.5 model access is granted here
            - { name: BEDROCK_MODEL_ID, value: "us.anthropic.claude-haiku-4-5-20251001-v1:0" }
            - { name: ALLOWED_ORIGIN, value: "https://experimentation.gunbarrelstudio.com" }
            - { name: DAILY_LLM_CALL_LIMIT, value: "50" }
            - { name: MAX_OUTPUT_TOKENS, value: "600" }
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { memory: 160Mi, cpu: 50m }
            limits: { memory: 400Mi, cpu: "1" }
          readinessProbe:
            httpGet: { path: /agent/healthz, port: 8000 } # static — never invokes Bedrock
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: experimentation
spec:
  selector: { app: agent }
  ports: [{ port: 8000, targetPort: 8000 }]
