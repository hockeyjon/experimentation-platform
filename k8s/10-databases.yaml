# Postgres, Mongo, Redis — the three datastores.
#
# Each gets a PersistentVolumeClaim on k3s's built-in local-path provisioner, so demo data
# survives pod restarts (the compose named-volume equivalent). strategy: Recreate on every
# DB Deployment because the PVCs are ReadWriteOnce — a rolling update would deadlock trying
# to mount the same volume into two pods at once.
# ---------------------------------------------------------------------------------- Postgres
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: experimentation
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: experimentation
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef: { name: db-secret }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "experimentation", "-d", "experiments"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: experimentation
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
# ------------------------------------------------------------------------------------- Mongo
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: experimentation
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: experimentation
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          # `args` (not `command`) so the image's docker-entrypoint.sh still runs — it's what
          # adds --bind_ip_all. Overriding `command` would bypass it and bind to localhost only,
          # leaving mongo unreachable from other pods. --quiet suppresses per-connection spam.
          args: ["--quiet"]
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mongo-data }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: experimentation
spec:
  selector: { app: mongo }
  ports:
    - port: 27017
      targetPort: 27017
---
# ------------------------------------------------------------------------------------- Redis
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: experimentation
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: experimentation
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis-data }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: experimentation
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
