# The application services: the Node.js GraphQL API and the Python stats microservice.
#
# Images are built on the box and imported straight into k3s's containerd (see the Makefile
# k8s-images target), so imagePullPolicy is IfNotPresent — there is no registry to pull from.
# An initContainer holds each service until its datastores accept TCP, replacing compose's
# depends_on: { condition: service_healthy }.
# ---------------------------------------------------------------------------------------- api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: experimentation
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z postgres 5432 && nc -z mongo 27017 && nc -z redis 6379; do echo waiting for datastores; sleep 2; done"
      containers:
        - name: api
          image: experimentation-api:latest
          imagePullPolicy: IfNotPresent
          # Create/patch tables (idempotent) before starting — same as the compose override.
          command: ["sh", "-c", "npx prisma db push --skip-generate && npm run start"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: db-secret }
          ports:
            - containerPort: 4000
          readinessProbe:
            tcpSocket: { port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: experimentation
spec:
  selector: { app: api }
  ports:
    - port: 4000
      targetPort: 4000
---
# -------------------------------------------------------------------------------------- stats
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats
  namespace: experimentation
spec:
  replicas: 1
  selector:
    matchLabels: { app: stats }
  template:
    metadata:
      labels: { app: stats }
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongo 27017; do echo waiting for mongo; sleep 2; done"]
      containers:
        - name: stats
          image: experimentation-stats:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: app-config }
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: stats
  namespace: experimentation
spec:
  selector: { app: stats }
  ports:
    - port: 8000
      targetPort: 8000
