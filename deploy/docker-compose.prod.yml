# Production stack for the EC2 instance.
#
# Difference from the local docker-compose.yml:
#   - Adds the app services (api, stats) as built images, plus Caddy for HTTPS.
#   - The web frontend is NOT here — it's served statically from S3/CloudFront.
#   - ONLY Caddy publishes ports (80/443). The databases and app services have no
#     published ports — they're reachable only on the internal Docker network.
#     That's why the security group never needed to open 5432/27017/6379/4000.
#   - Services talk to each other by service name (postgres, mongo, redis), not localhost.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build: ../api
    restart: unless-stopped
    environment:
      # Hosts are Docker service names, resolved on the internal network.
      DATABASE_URL: postgresql://experimentation:experimentation@postgres:5432/experiments?schema=public
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: experiments_events
      REDIS_URL: redis://redis:6379
      PORT: "4000"
      # The Python significance service, reachable only on this internal network. The api
      # relays it to the browser over SSE so it needs no public route of its own.
      STATS_URL: http://stats:8000
      STATS_POLL_MS: "3000"
      # Keep the boot output clean: the Prisma CLI otherwise prints a boxed "Update
      # available 6.x -> 7.x" banner on every `db push`, which lands in the log stream.
      # CHECKPOINT_DISABLE also skips the outbound version-check request at startup.
      PRISMA_HIDE_UPDATE_MESSAGE: "true"
      CHECKPOINT_DISABLE: "1"
    # Create tables (idempotent) before starting the server.
    command: sh -c "npx prisma db push --skip-generate && npm run start"
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  stats:
    build: ../stats
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: experiments_events
    depends_on:
      mongo: { condition: service_healthy }

  # Streams REDACTED api+stats logs over a WebSocket (Caddy proxies /logstream here).
  logstream:
    build: ../logstream
    restart: unless-stopped
    environment:
      # Not real secrets (the token ships in the public bundle) — they only deter casual
      # access. Redaction + the time/connection limits are the actual protection.
      LOGSTREAM_TOKEN: ${LOGSTREAM_TOKEN:-let-me-see-the-logs}
      ALLOWED_ORIGIN: https://experimentation.gunbarrelstudio.com
      MAX_STREAM_SECONDS: "300"
      # Minimum gap between /logstream/reset recreates of api + stats.
      RESET_COOLDOWN_SECONDS: "30"
    volumes:
      # Docker API access: tails the api/stats logs, and recreates those two containers
      # for /logstream/reset. NOTE: `:ro` restricts the socket file, NOT the API — the
      # Docker API has no read-only mode, so this mount grants broad Docker control.
      # Acceptable for an isolated demo; a hardened setup would put a socket proxy
      # (e.g. tecnativa/docker-socket-proxy) in front with only the needed endpoints.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
      - stats

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: experimentation
      POSTGRES_PASSWORD: experimentation
      POSTGRES_DB: experiments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experimentation -d experiments"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    # --quiet suppresses per-connection "accepted/ended" log spam (mostly the 5s
    # healthcheck). Data operations are logged by the api service, not mongod.
    command: ["mongod", "--quiet"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      # 30s steady-state keeps the log quiet; start_interval still probes fast at boot.
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mongodata:
  redisdata:
  caddy_data:
  caddy_config:
